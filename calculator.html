<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JavaScript Calculator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      color: #222;
      margin: 40px;
    }

    h1 {
      color: #2c3e50;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      margin: 20px 0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    th, td {
      border: 1px solid #cfd8dc;
      text-align: center;
      padding: 10px 14px;
    }

    th {
      background-color: #2c3e50;
      color: #ffffff;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.05em;
    }

    tr:nth-child(even) {
      background-color: #eef2f5;
    }

    tr:hover {
      background-color: #dbe9f5;
    }

    .error {
      color: #c0392b;
      font-weight: bold;
    }

    h2 {
      color: #2c3e50;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Simple JavaScript Calculator</h1>
  <p>You will be prompted for two numbers and an operator. Click "OK" to keep calculating, or "Cancel" on any prompt to stop and see the summary.</p>

  <script src="calculator.js"></script>
</body>
</html>
